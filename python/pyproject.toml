[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tvbounds"
version = "0.1.2"
description = "Sensitivity Analysis and Bounds under Total Variation Neighborhoods"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Filippo Palomba", email = "fpalomba@princeton.edu"}]
keywords = ["sensitivity analysis", "partial identification", "total variation",
            "attrition", "Lee bounds", "instrumental variables", "counterfactuals",
            "robustness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
julia = ["juliacall>=0.9.20"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://filippopalomba.github.io/#jmp"

[tool.setuptools]
packages = ["tvbounds", "tvbounds.julia", "tvbounds.julia.opt", "tvbounds.julia.examples"]
include-package-data = true

[tool.setuptools.package-data]
tvbounds = ["juliapkg.json"]
"tvbounds.julia" = ["*.jl", "*.toml"]
"tvbounds.julia.opt" = ["*.opt"]
"tvbounds.julia.examples" = ["*.jl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
